<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Sheet — Naitree</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ─── Base ─── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f4f6;
      color: #111;
    }

    /* ─── Login card ─── */
    #login-screen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
      padding: 36px 32px; width: 340px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .login-card h1 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .login-card p  { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 11px; font-weight: 700; color: #6b7280;
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px;
    }
    .field input {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
      border-radius: 10px; font-size: 14px; outline: none; transition: border .15s;
    }
    .field input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
    #login-btn {
      width: 100%; padding: 11px; background: #111827; color: #fff;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 4px; transition: background .15s;
    }
    #login-btn:hover    { background: #374151; }
    #login-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    #login-error { margin-top: 12px; font-size: 12px; color: #dc2626; text-align: center; }

    /* ─── Sheet screen ─── */
    #sheet-screen { display: none; }

    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: #fff; border-bottom: 1px solid #e5e7eb;
      padding: 10px 20px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .topbar-title { flex: 1; min-width: 180px; }
    .topbar-title h2 { font-size: 15px; font-weight: 800; }
    .topbar-title p  { font-size: 11px; color: #6b7280; margin-top: 2px; }

    .range-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #374151; flex-wrap: wrap;
    }
    .range-row label { font-weight: 600; white-space: nowrap; }
    .range-row input[type=number] {
      width: 70px; padding: 7px 10px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 13px; text-align: center; outline: none;
    }
    .range-row input[type=number]:focus { border-color: #6366f1; }
    .range-row .apply-btn {
      padding: 7px 14px; background: #f3f4f6; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .range-row .apply-btn:hover { background: #e5e7eb; }

    .btn-print {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; background: #111827; color: #fff;
      border: none; border-radius: 10px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    .btn-print:hover { background: #374151; }
    .btn-print svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ─── Tile index ─── */
    .index-section {
      margin: 16px 20px 0;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden;
    }
    .index-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; cursor: pointer; user-select: none;
      font-size: 13px; font-weight: 700; color: #374151;
      background: #f9fafb;
    }
    .index-header:hover { background: #f3f4f6; }
    .index-header span { color: #6b7280; font-weight: 400; margin-left: 6px; }
    .index-body { display: none; max-height: 360px; overflow-y: auto; }
    .index-body.open { display: block; }
    .index-table {
      width: 100%; border-collapse: collapse; font-size: 12px;
    }
    .index-table th {
      position: sticky; top: 0; background: #f9fafb;
      padding: 6px 12px; text-align: left; font-size: 11px;
      color: #6b7280; border-bottom: 1px solid #e5e7eb; font-weight: 600;
    }
    .index-table td {
      padding: 5px 12px; border-bottom: 1px solid #f3f4f6; color: #374151;
    }
    .index-table tr:last-child td { border-bottom: none; }
    .index-table td:first-child { color: #6b7280; font-family: monospace; width: 52px; }
    .index-table td:last-child { color: #9ca3af; font-family: monospace; font-size: 11px; }
    .index-hint {
      padding: 10px 16px; font-size: 12px; color: #6b7280; border-top: 1px solid #f3f4f6;
      background: #fffbeb;
    }

    /* ─── A4 page preview ─── */
    .sheet-area { padding: 20px; }
    .a4-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto 16px;
      padding: 10mm;
      box-shadow: 0 2px 12px rgba(0,0,0,.12);
    }

    /* ─── Grid ─── */
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 3mm;
    }

    /* ─── Tile ─── */
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 21mm;
      text-align: center;
      padding: 2mm 1.5mm 1.5mm;
      border: 0.5pt solid #e5e7eb;
      border-radius: 3pt;
      position: relative;
    }

    /* Tile number badge — screen only */
    .tile-num {
      position: absolute; top: 1pt; left: 2pt;
      font-size: 5pt; color: #c4b5fd; font-weight: 700;
      font-family: monospace; line-height: 1;
    }

    /* qrcodejs draws to canvas, converts to img, then HIDES the canvas.
       So: size the img, leave canvas alone — never hide the img. */
    .qr-wrap     { width: 15mm; height: 15mm; overflow: hidden; flex-shrink: 0; }
    .qr-wrap img { width: 15mm !important; height: 15mm !important; display: block !important; }

    .tile .name {
      font-size: 7pt; font-weight: 700; color: #111827;
      margin-top: 2pt; line-height: 1.3; word-break: break-word;
    }
    .tile .sku {
      font-size: 6pt; color: #6b7280;
      font-family: 'Courier New', monospace;
      margin-top: 1pt; word-break: break-all;
    }

    /* ─── Print ─── */
    @media print {
      @page { size: A4 portrait; margin: 10mm; }

      body        { background: #fff; }
      .no-print   { display: none !important; }
      .sheet-area { padding: 0; }

      .a4-page {
        width: 100%; min-height: auto; margin: 0; padding: 0;
        box-shadow: none;
        page-break-after: always; break-after: page;
      }
      .a4-page:last-child { page-break-after: auto; break-after: auto; }

      .grid { gap: 2mm; }

      .tile {
        width: 21mm; padding: 1.5mm 1mm 1mm;
        page-break-inside: avoid; break-inside: avoid;
      }
      .tile-num { display: none; }
      .qr-wrap     { width: 1.5cm; height: 1.5cm; }
      .qr-wrap img { width: 1.5cm !important; height: 1.5cm !important; display: block !important; }
      .tile .name { font-size: 5.5pt; }
      .tile .sku  { font-size: 4.5pt; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h1>🖨️ Print QR Codes</h1>
    <p>Sign in to load your inventory — one QR printed per unit in stock</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button id="login-btn" onclick="login()">Load QR Codes</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- SHEET -->
<div id="sheet-screen">

  <div class="topbar no-print">
    <div class="topbar-title">
      <h2>QR Code Print Sheet</h2>
      <p id="status-line">Loading…</p>
    </div>
    <div class="range-row">
      <label>Print tiles</label>
      <input type="number" id="from-tile" min="1" value="1" />
      <label>to</label>
      <input type="number" id="to-tile" min="1" value="" placeholder="end" />
      <button class="apply-btn" onclick="applyRange()">Apply</button>
    </div>
    <button class="btn-print" onclick="window.print()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      Print / Save PDF
    </button>
  </div>

  <!-- Tile index: numbered list of every tile -->
  <div class="index-section no-print" id="index-section" style="display:none">
    <div class="index-header" onclick="toggleIndex()">
      📋 Tile Index — match your printed sheets to tile numbers
      <span id="index-toggle-label">▶ Show</span>
    </div>
    <div class="index-body" id="index-body">
      <table class="index-table">
        <thead><tr><th>#</th><th>Product</th><th>SKU</th></tr></thead>
        <tbody id="index-tbody"></tbody>
      </table>
      <div class="index-hint">
        💡 Find the last tile you printed → note its number → set "Print tiles FROM" to the next number above
      </div>
    </div>
  </div>

  <div class="sheet-area" id="sheet-area"></div>
</div>

<script>
  const { createClient } = supabase;
  const sb = createClient(
    'https://thzdoxaxqweaxxlujush.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoemRveGF4cXdlYXh4bHVqdXNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0Nzc4NTksImV4cCI6MjA4NjA1Mzg1OX0.XlYh3-vMnkjTgqkLhmHvKUJbKUGzxNmtlC7WfEsYW3g'
  );

  const TILES_PER_PAGE = 88;  // 8 cols × 11 rows

  let allTiles = [];

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl    = document.getElementById('login-error');
    const btn      = document.getElementById('login-btn');

    errEl.textContent = '';
    if (!email || !password) { errEl.textContent = 'Enter your email and password.'; return; }

    btn.disabled    = true;
    btn.textContent = 'Signing in…';

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = error.message;
      btn.disabled      = false;
      btn.textContent   = 'Load QR Codes';
      return;
    }

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('sheet-screen').style.display = 'block';
    await loadQRCodes();
  }

  async function loadQRCodes() {
    const statusEl = document.getElementById('status-line');
    statusEl.textContent = 'Fetching inventory…';

    const { data: products, error } = await sb
      .from('products')
      .select('id, name, sku, stock, has_variants, variants(id, name, sku, stock)')
      .order('name', { ascending: true });

    if (error) { statusEl.textContent = 'Error: ' + error.message; return; }

    const tiles = [];
    let skipped = 0;

    for (const p of products) {
      if (p.has_variants && p.variants && p.variants.length > 0) {
        for (const v of p.variants) {
          const qty = Math.max(0, Math.floor(v.stock ?? 0));
          if (!v.sku) { skipped++; continue; }
          if (qty === 0) continue;
          for (let i = 0; i < qty; i++)
            tiles.push({ sku: v.sku, label: `${p.name} — ${v.name}` });
        }
      } else {
        const qty = Math.max(0, Math.floor(p.stock ?? 0));
        if (!p.sku) { skipped++; continue; }
        if (qty === 0) continue;
        for (let i = 0; i < qty; i++)
          tiles.push({ sku: p.sku, label: p.name });
      }
    }

    allTiles = tiles;

    // Populate the tile index table
    const tbody = document.getElementById('index-tbody');
    tiles.forEach((t, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${i + 1}</td><td>${t.label}</td><td>${t.sku}</td>`;
      tbody.appendChild(tr);
    });
    document.getElementById('to-tile').value = tiles.length;
    document.getElementById('index-section').style.display = '';
    document.getElementById('index-section').querySelector('span').textContent =
      `(${tiles.length} tiles total) ▶ Show`;

    const pageCount = Math.ceil(tiles.length / TILES_PER_PAGE);
    const skippedMsg = skipped > 0 ? ` · ${skipped} skipped (no SKU)` : '';
    statusEl.textContent =
      `${tiles.length} tiles · ${pageCount} A4 page${pageCount !== 1 ? 's' : ''}${skippedMsg}`;

    renderSheet(1, tiles.length);
  }

  function applyRange() {
    const from = Math.max(1, parseInt(document.getElementById('from-tile').value, 10) || 1);
    const to   = parseInt(document.getElementById('to-tile').value, 10) || allTiles.length;
    renderSheet(from, to);
  }

  function toggleIndex() {
    const body  = document.getElementById('index-body');
    const label = document.getElementById('index-toggle-label');
    const open  = body.classList.toggle('open');
    const count = allTiles.length;
    label.textContent = open
      ? `(${count} tiles total) ▼ Hide`
      : `(${count} tiles total) ▶ Show`;
  }

  function renderSheet(fromTile, toTile) {
    const statusEl  = document.getElementById('status-line');
    const sheetArea = document.getElementById('sheet-area');
    sheetArea.innerHTML = '';

    const from = Math.max(1, fromTile);
    const to   = Math.min(allTiles.length, toTile);
    const slice = allTiles.slice(from - 1, to);  // 1-indexed → 0-indexed

    const totalPages = Math.ceil(allTiles.length / TILES_PER_PAGE);
    const rangeMsg   = (from > 1 || to < allTiles.length)
      ? ` · printing tiles ${from}–${to}`
      : '';

    statusEl.textContent =
      `${allTiles.length} tiles · ${totalPages} A4 page${totalPages !== 1 ? 's' : ''}` +
      rangeMsg;

    if (slice.length === 0) {
      sheetArea.innerHTML =
        '<p style="color:#6b7280;font-size:14px;padding:40px;text-align:center">' +
        'No tiles in that range. Adjust the tile numbers above.</p>';
      return;
    }

    const pageCount = Math.ceil(slice.length / TILES_PER_PAGE);

    for (let p = 0; p < pageCount; p++) {
      const page = document.createElement('div');
      page.className = 'a4-page';

      const grid = document.createElement('div');
      grid.className = 'grid';
      page.appendChild(grid);
      sheetArea.appendChild(page);

      const pageTiles = slice.slice(p * TILES_PER_PAGE, (p + 1) * TILES_PER_PAGE);

      pageTiles.forEach((tile, i) => {
        const globalNum = from + p * TILES_PER_PAGE + i;

        const div = document.createElement('div');
        div.className = 'tile';

        // Tile number badge (screen only — hidden in print CSS)
        const numBadge = document.createElement('div');
        numBadge.className = 'tile-num no-print';
        numBadge.textContent = '#' + globalNum;
        div.appendChild(numBadge);

        const qrWrap = document.createElement('div');
        qrWrap.className = 'qr-wrap';
        div.appendChild(qrWrap);

        const labelEl = document.createElement('div');
        labelEl.className = 'name';
        labelEl.textContent = tile.label;
        div.appendChild(labelEl);

        const skuEl = document.createElement('div');
        skuEl.className = 'sku';
        skuEl.textContent = tile.sku;
        div.appendChild(skuEl);

        grid.appendChild(div);

        new QRCode(qrWrap, {
          text:         tile.sku,
          width:        200,
          height:       200,
          colorDark:    '#111827',
          colorLight:   '#ffffff',
          correctLevel: QRCode.CorrectLevel.M,
        });
      });
    }
  }
</script>
</body>
</html>
